id: hot-endpoint
name: Hot Endpoint / Request Flood
description: >
  A large fraction of the thread pool is executing the exact same code path
  at the same moment. In a thread dump this appears as dozens or hundreds of
  threads with identical top stack frames — all calling the same controller
  method, servlet, or internal service method.

  The engine groups threads by their top 3 stack frames (called a "fingerprint").
  When one fingerprint dominates the dump, it means all those threads received
  the same type of request and are processing it concurrently. Normal traffic
  produces many different fingerprints. A flood produces one.

  Common causes: a missing or broken cache forcing every request to recompute
  the same expensive result; a runaway scheduled job or monitoring client making
  repeated calls; an upstream retry storm amplifying a slow response.
version: "1.1"

conditions:
  - field: dominantActiveFingerprintCount
    operator: gte
    value: 50
    description: >
      The engine groups RUNNABLE threads by their top 3 stack frames. This field
      is the thread count of the largest such group (WAITING and TIMED_WAITING
      threads are excluded -- idle pool workers sharing Unsafe.park frames are
      not a hot endpoint). A value of 50 means at least 50 threads are actively
      executing the same code path simultaneously.
  - field: dominantActiveFingerprintRatio
    operator: gte
    value: 0.25
    description: >
      The dominant RUNNABLE fingerprint count divided by total thread count. A
      value of 0.25 means 1 in 4 of all threads is actively running the same
      code path. Idle pool threads (WAITING/TIMED_WAITING) are excluded so this
      ratio reflects genuine active load concentration, not thread-pool sizing.
      0.25 or higher is abnormal for healthy systems under balanced load.

indicators:
  - "One stack fingerprint accounts for 25%+ of all threads"
  - "All affected threads are RUNNABLE — they are actively processing, not waiting"
  - "The dominant top frame identifies the exact method being flooded"

nextSteps:
  - "Look at the top frame of the dominant fingerprint — that is the entry point being hit"
  - "Check for a recent deploy that may have disabled or misconfigured the cache"
  - "Check Splunk for request rate on that endpoint ±5min — look for a spike"
  - "Check for a single client IP or service account generating the volume"
  - "If it is a scheduled job, check whether it is running more frequently than intended"

relatedSignatures:
  - db-pool-exhaustion
