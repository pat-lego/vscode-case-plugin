id: http-conn-pool-exhaustion
name: HTTP Connection Pool Exhaustion
description: >
  Many request-processing threads are stuck in TIMED_WAITING state waiting to acquire a
  connection from an outbound HTTP connection pool. Unlike database pool exhaustion (which
  uses synchronized blocks and appears as BLOCKED threads), Apache HttpClient and similar
  libraries use java.util.concurrent locks — so affected threads show TIMED_WAITING with
  a "parking to wait for" line pointing to an AbstractQueuedSynchronizer ConditionObject,
  and a key frame of AbstractConnPool.getPoolEntryBlocking or similar.

  The pattern is: every request for a particular page or service tries to make an outbound
  HTTP call. The connection pool has a fixed max size. When all connections are in use, new
  requestors park with a deadline (awaitUntil). If the downstream service is slow — high
  latency, hang, or refusing connections — connections are not returned, the queue of waiters
  grows, Jetty threads are consumed, and the server becomes unresponsive to new traffic.

  Common causes: downstream service is overloaded or timing out; the connection pool
  max-size is too small for the request rate; keep-alive connections are not being evicted;
  a single slow request holds a connection and creates a cascade.
version: "1.0"

conditions:
  - field: suspiciousTimedWaitingCount
    operator: gte
    value: 15
    description: >
      Count of threads in the most common TIMED_WAITING fingerprint that is NOT an idle
      worker pattern (Jetty queue poll, scheduler idle, JVM cleaner, etc.). A value of 15
      means at least 15 threads are parked waiting for the same resource. Idle thread-pool
      workers are excluded so this only fires on genuinely stuck threads.
  - field: suspiciousTimedWaitingKeyFrame
    operator: contains
    value: ConnPool
    description: >
      The first non-JVM frame in the dominant stuck TIMED_WAITING stack — the actual code
      doing the waiting. "ConnPool" matches Apache HttpClient's AbstractConnPool and
      PoolingHttpClientConnectionManager, which are the classes that gate access to the
      outbound HTTP connection pool. Matching on the key frame (not the raw top frame of
      "Unsafe.park") makes this condition readable and reliable.

indicators:
  - "Request-named threads (IP address in thread name) are all TIMED_WAITING"
  - "Stack contains AbstractConnPool.getPoolEntryBlocking or PoolingHttpClientConnectionManager"
  - "Threads show '- parking to wait for <addr> (a AbstractQueuedSynchronizer$ConditionObject)'"
  - "The downstream service targeted by those requests is likely slow or unavailable"

nextSteps:
  - "Identify which URL/endpoint these threads are serving — look at the thread names (they contain the HTTP request path)"
  - "Find which downstream service the pool is connecting to — look below getPoolEntryBlocking for the target host or service name"
  - "Check the downstream service: is it responding? Are its own health checks passing?"
  - "Check connection pool config: what is maxTotal and defaultMaxPerRoute? Are they sized for the load?"
  - "Look for connection timeout errors in the application logs ±5min"
  - "Check if the pool has a connection eviction policy — stale keep-alive connections may be filling the pool"
  - "Temporary mitigation: restart the pod/instance to clear blocked threads; long-term fix is to right-size the pool or add a circuit breaker"

