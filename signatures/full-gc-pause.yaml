id: full-gc-pause
name: Full GC Pressure / Stop-the-World Candidate
description: >
  The JVM is under significant garbage collection pressure. A thread dump
  cannot directly confirm a stop-the-world pause (the JVM is frozen during one
  so no dump can be taken mid-pause), but it can show the aftermath or the
  conditions that cause frequent pauses.

  Two signals are used together. First, the dump contains a meaningful number
  of threads whose names identify them as JVM GC subsystem threads — names like
  "GC task thread#0 (ParallelGC)", "G1 Conc#0", "ZWorker#1", or "Shenandoah
  GC Thread". These are always present in a JVM but their count grows when GC
  is actively running parallel or concurrent work. Second, a large proportion
  of application threads are in the WAITING state (parked, sleeping, or waiting
  on a lock) rather than RUNNABLE — consistent with threads having been forced
  to yield while the GC ran.

  This signature raises a hypothesis. Confirm or rule it out using GC logs in
  Splunk — look for pause times, allocation rates, and heap utilisation.
version: "1.1"

conditions:
  - field: gcThreadCount
    operator: gte
    value: 4
    description: >
      Count of threads in the dump whose names match known JVM GC naming
      patterns: "GC task thread", "Gang worker" (ParallelGC), "G1 Conc",
      "ZWorker", "Shenandoah GC Thread", and equivalents for IBM J9
      ("MM " prefix, "GCWorker"). A baseline JVM always has a few GC threads;
      4 or more visible in the dump suggests GC subsystems are actively engaged.
      This is counted per dump, not across dumps.
  - field: waitingThreadCount
    operator: gte
    value: 50
    description: >
      Count of application threads in the WAITING or TIMED_WAITING state at
      the moment the dump was taken. During or immediately after a GC pause,
      many application threads are found parked (LockSupport.park, Object.wait,
      Thread.sleep) because they completed their current work and were waiting
      for the next unit — only to have the JVM pause them before they could
      receive it. 50+ waiting threads in a system that should be busy indicates
      throughput has collapsed, which is consistent with GC pressure.
  - field: threadCountAnomaly
    operator: eq
    value: 1
    description: >
      Set to 1 when total thread count exceeds the configured threshold
      (default: 500). Under severe heap pressure the JVM may create additional
      finalizer, reference handler, and GC threads, inflating the thread count.
      This is a soft corroborating signal — it strengthens the hypothesis but
      is not required on its own.

indicators:
  - "Multiple JVM GC subsystem threads visible in the dump"
  - "Large proportion of application threads are parked or waiting — throughput has collapsed"
  - "GC logs will show the definitive pause times and frequency"

nextSteps:
  - "Fetch Splunk: GC log entries ±10min — look for pause times above 1s and high allocation rates"
  - "Check heap utilisation metrics — if old-gen is above 80% consistently, that drives full GC"
  - "Review recent deploys for changes that allocate large objects or hold large collections in memory"
  - "If pauses are frequent and short, consider tuning GC algorithm (G1 vs ZGC vs Shenandoah)"
  - "If heap is consistently near capacity, consider a heap dump to find what is consuming memory"

relatedSignatures:
  - db-pool-exhaustion
